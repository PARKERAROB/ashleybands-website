<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wilmington Symphonic Winds - TITANS</title>
<meta name="description" content="Wilmington Symphonic Winds presents TITANS - May 31, 2026, Kenan Auditorium.">
<style>
 *{box-sizing:border-box;margin:0;padding:0;}
 html,body{height:100%;background:#0b0b0d;color:#fff;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow:hidden;}
 #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
 #slide{max-width:100vw;max-height:100vh;object-fit:contain;user-select:none;-webkit-user-drag:none;}
 .zone{position:fixed;top:0;bottom:0;z-index:5;cursor:pointer;}
 #prevZone{left:0;width:30%;}#nextZone{right:0;width:70%;}
 #prog{position:fixed;left:0;top:0;height:3px;width:0;z-index:9;background:#7fd0a0;}
 #prog.hide{display:none;}
 #cap{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:10px 16px 12px;
  background:linear-gradient(transparent,rgba(0,0,0,.78));font-size:15px;text-align:center;
  display:flex;justify-content:center;gap:12px;align-items:baseline;flex-wrap:wrap;}
 #cap .stopn{color:#7fd0a0;font-weight:600;}
 #cap .sub{opacity:.7;font-variant-numeric:tabular-nums;}
 #cap.hide{display:none;}
 #bar{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:10;display:flex;gap:12px;
  align-items:center;padding:7px 14px;border-radius:999px;background:rgba(20,20,24,.6);
  backdrop-filter:blur(8px);opacity:0;transition:opacity .25s;font-size:14px;}
 body:hover #bar{opacity:1;}
 #bar.hide{display:none;}
 #bar button{background:none;border:none;color:#fff;font-size:17px;cursor:pointer;padding:3px 5px;}
 #bar button:hover{color:#7fd0a0;}
 #pos{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;opacity:.85;}
 #hint{position:fixed;left:50%;bottom:6px;transform:translateX(-50%);z-index:6;font-size:11px;opacity:.4;}
 #hint.hide{display:none;}
 @media(max-width:700px){#hint{display:none;}#bar{opacity:1;}}
</style></head><body>
 <div id="prog"></div>
 <div id="stage"><img id="slide" alt=""></div>
 <div id="prevZone" class="zone" title="Previous section"></div>
 <div id="nextZone" class="zone" title="Next section"></div>
 <div id="bar">
  <button id="prev" title="Previous (left arrow)">&#10094;</button>
  <span id="pos">1 / 1</span>
  <button id="next" title="Next (right arrow)">&#10095;</button>
  <button id="capBtn" title="Toggle chrome (C)">&#9776;</button>
  <button id="full" title="Fullscreen (F)">&#9974;</button>
 </div>
 <div id="cap"><span class="stopn"></span><span class="sub"></span></div>
 <div id="hint">left / right arrows, click, or space to change section &middot; rotating sections loop on their timer &middot; C chrome &middot; F fullscreen</div>
<script>
const DATA={"stops": [{"name": "Pre-concert", "loop": true, "slides": [{"img": "/wsw/images/title.jpg", "sec": 30}, {"img": "/wsw/images/c500.jpg", "sec": 30}, {"img": "/wsw/images/support.jpg", "sec": 60}]}, {"name": "Symphony No. VII \"Titan\" - Julie Giroux", "loop": false, "slides": [{"img": "/wsw/images/titan.jpg", "sec": 0}]}, {"name": "Titan I - Sunrise on CoRoT-7b", "loop": false, "slides": [{"img": "/wsw/images/tm1.jpg", "sec": 0}]}, {"name": "Titan III - Lord of a Thousand Rings", "loop": false, "slides": [{"img": "/wsw/images/tm2.jpg", "sec": 0}]}, {"name": "Titan II - Where Stars are Born", "loop": false, "slides": [{"img": "/wsw/images/tm3.jpg", "sec": 0}]}, {"name": "Titan IV - Departure", "loop": false, "slides": [{"img": "/wsw/images/tm4.jpg", "sec": 0}]}, {"name": "Titan V - Sleeping Dragon", "loop": false, "slides": [{"img": "/wsw/images/tm5.jpg", "sec": 0}]}, {"name": "Titan VI - Kraken Mare", "loop": false, "slides": [{"img": "/wsw/images/tm6.jpg", "sec": 0}]}, {"name": "Intermission", "loop": true, "slides": [{"img": "/wsw/images/title.jpg", "sec": 30}, {"img": "/wsw/images/c500.jpg", "sec": 30}, {"img": "/wsw/images/support.jpg", "sec": 60}]}, {"name": "Blow It Up, Start Again - Jonathan Newman", "loop": false, "slides": [{"img": "/wsw/images/blow.jpg", "sec": 0}]}, {"name": "As Midnight on a Moonless Night - Michael Markowski", "loop": false, "slides": [{"img": "/wsw/images/midnight.jpg", "sec": 0}]}, {"name": "Only Light - Aaron Perrine", "loop": false, "slides": [{"img": "/wsw/images/onlylight.jpg", "sec": 0}]}, {"name": "DOPE - Katahj Copley", "loop": false, "slides": [{"img": "/wsw/images/dope.jpg", "sec": 0}]}, {"name": "Support", "loop": false, "slides": [{"img": "/wsw/images/support.jpg", "sec": 0}]}], "preload": ["/wsw/images/title.jpg", "/wsw/images/c500.jpg", "/wsw/images/support.jpg", "/wsw/images/titan.jpg", "/wsw/images/tm1.jpg", "/wsw/images/tm2.jpg", "/wsw/images/tm3.jpg", "/wsw/images/tm4.jpg", "/wsw/images/tm5.jpg", "/wsw/images/tm6.jpg", "/wsw/images/blow.jpg", "/wsw/images/midnight.jpg", "/wsw/images/onlylight.jpg", "/wsw/images/dope.jpg"]};
const STOPS=DATA.stops;
let stopIdx=0, slideIdx=0, timer=null;
const img=document.getElementById('slide'),pos=document.getElementById('pos'),
 cap=document.getElementById('cap'),stopn=cap.querySelector('.stopn'),sub=cap.querySelector('.sub'),
 prog=document.getElementById('prog'),bar=document.getElementById('bar'),hint=document.getElementById('hint');
// warm the cache so rotation + advances are instant
DATA.preload.forEach(u=>{const i=new Image();i.src=u;});
function clearTimer(){if(timer){clearTimeout(timer);timer=null;}}
function animateProg(ms){prog.classList.remove('hide');prog.style.transition='none';prog.style.width='0%';void prog.offsetWidth;prog.style.transition='width '+ms+'ms linear';prog.style.width='100%';}
function render(){
 clearTimer();
 const stop=STOPS[stopIdx], s=stop.slides[slideIdx];
 img.src=s.img; img.alt=stop.name;
 pos.textContent=(stopIdx+1)+' / '+STOPS.length;
 stopn.textContent=stop.name;
 sub.textContent = stop.slides.length>1 ? ('rotating '+(slideIdx+1)+'/'+stop.slides.length+' · '+s.sec+'s') : '';
 if(s.sec>0){
  animateProg(s.sec*1000);
  timer=setTimeout(()=>{
   slideIdx++;
   if(slideIdx>=stop.slides.length){ if(!stop.loop){return;} slideIdx=0; }
   render();
  }, s.sec*1000);
 } else { prog.classList.add('hide'); }
}
function nextStop(){stopIdx=(stopIdx+1)%STOPS.length;slideIdx=0;render();}
function prevStop(){stopIdx=(stopIdx-1+STOPS.length)%STOPS.length;slideIdx=0;render();}
function toggleChrome(){[cap,bar,hint].forEach(e=>e.classList.toggle('hide'));}
function toggleFull(){if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}else{document.exitFullscreen&&document.exitFullscreen();}}
document.getElementById('next').onclick=nextStop;
document.getElementById('prev').onclick=prevStop;
document.getElementById('capBtn').onclick=toggleChrome;
document.getElementById('full').onclick=toggleFull;
document.getElementById('nextZone').onclick=nextStop;
document.getElementById('prevZone').onclick=prevStop;
document.addEventListener('keydown',e=>{
 if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();nextStop();}
 else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prevStop();}
 else if(e.key==='Home'){stopIdx=0;slideIdx=0;render();}
 else if(e.key==='End'){stopIdx=STOPS.length-1;slideIdx=0;render();}
 else if(e.key.toLowerCase()==='c')toggleChrome();
 else if(e.key.toLowerCase()==='f')toggleFull();
});
let sx=null;
document.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)dx<0?nextStop():prevStop();sx=null;},{passive:true});
render();
</script></body></html>
