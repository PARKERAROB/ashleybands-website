<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theory Quest — Ashley HS Bands</title>
<meta name="description" content="An 8-bit music theory RPG. Learn to read music one quest at a time. From Ashley HS Bands.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Music&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#100a24; --bg2:#1a1140; --panel:#241a52; --panel2:#2e2168;
    --ink:#ece9ff; --mut:#a99fe0; --line:#4b3a9a;
    --gold:#ffd23f; --gold-d:#c79a14;
    --good:#3ddc84; --bad:#ff5d6c; --cyan:#46e0ff; --pink:#ff6ad5;
    --parch:#f3ecd6; --parch-line:#2a2310;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:
      radial-gradient(circle at 20% 10%, #2a1b63 0, transparent 45%),
      radial-gradient(circle at 85% 90%, #3a1b5a 0, transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Press Start 2P', monospace;
    -webkit-font-smoothing:none;
    image-rendering:pixelated;
    overflow-x:hidden;
  }
  #app{max-width:760px;margin:0 auto;padding:18px 14px 60px;}

  /* generic pixel chrome */
  .panel{
    background:var(--panel);
    border:3px solid #000;
    box-shadow:0 0 0 3px var(--line), 6px 6px 0 #000;
    padding:16px;
    margin:14px 0;
  }
  h1,h2,h3{line-height:1.5;margin:0 0 12px;}
  h1{font-size:22px;color:var(--gold);text-shadow:3px 3px 0 #000;}
  h2{font-size:15px;color:var(--cyan);text-shadow:2px 2px 0 #000;}
  h3{font-size:12px;color:var(--gold);}
  p,li{font-size:11px;line-height:1.9;color:var(--ink);}
  .mut{color:var(--mut);}
  .center{text-align:center;}
  .tiny{font-size:9px;}

  .btn{
    font-family:inherit;font-size:11px;cursor:pointer;
    background:var(--gold);color:#231400;
    border:3px solid #000;box-shadow:4px 4px 0 #000;
    padding:12px 16px;margin:6px 6px 6px 0;
    transition:transform .04s, box-shadow .04s;
    text-transform:uppercase;
  }
  .btn:hover{transform:translate(1px,1px);box-shadow:3px 3px 0 #000;}
  .btn:active{transform:translate(4px,4px);box-shadow:0 0 0 #000;}
  .btn.alt{background:var(--cyan);}
  .btn.ghost{background:var(--panel2);color:var(--ink);}
  .btn.lg{font-size:14px;padding:16px 22px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(1);}
  .btn.good{background:var(--good);}
  .btn.bad{background:var(--bad);color:#fff;}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(min-width:560px){.grid4{grid-template-columns:1fr 1fr 1fr 1fr;}}

  /* title screen */
  .title-hero{padding:40px 16px;text-align:center;}
  .title-hero .big{font-size:30px;color:var(--gold);text-shadow:4px 4px 0 #000,0 0 18px var(--gold-d);line-height:1.4;}
  .title-hero .sub{font-size:11px;color:var(--cyan);margin-top:14px;}
  .blink{animation:blink 1s steps(2,start) infinite;}
  @keyframes blink{to{visibility:hidden;}}

  /* HUD */
  .hud{display:flex;gap:10px;align-items:center;justify-content:space-between;
    background:#000;border:3px solid var(--line);padding:8px 10px;margin-bottom:10px;flex-wrap:wrap;}
  .hud .stat{font-size:9px;color:var(--gold);}
  .hud .stat b{color:#fff;}
  .meter{flex:1;min-width:130px;}
  .meter .lbl{font-size:8px;color:var(--cyan);margin-bottom:4px;}
  .bar{height:14px;background:#3a0f1a;border:2px solid #000;position:relative;overflow:hidden;}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--cyan));transition:width .25s;}
  .bar.low>i{background:linear-gradient(90deg,var(--bad),#ff9a3d);}

  /* map */
  .book-band{margin:18px 0 6px;font-size:10px;color:var(--pink);text-shadow:2px 2px 0 #000;letter-spacing:1px;}
  .zone{display:flex;gap:12px;align-items:center;border:3px solid #000;
    box-shadow:4px 4px 0 #000;padding:10px 12px;margin:8px 0;background:var(--panel2);cursor:pointer;}
  .zone:hover{transform:translate(1px,1px);}
  .zone.locked{background:#1a1533;cursor:not-allowed;opacity:.6;}
  .zone.cleared{box-shadow:4px 4px 0 var(--good);}
  .zone .num{font-size:16px;color:var(--gold);min-width:34px;text-align:center;}
  .zone .meta b{font-size:11px;color:var(--ink);}
  .zone .meta span{display:block;font-size:8px;color:var(--mut);margin-top:5px;}
  .zone .tag{margin-left:auto;font-size:8px;color:var(--cyan);}

  /* node path */
  .node{display:flex;gap:12px;align-items:center;border:3px solid #000;box-shadow:4px 4px 0 #000;
    padding:10px 12px;margin:8px 0;background:var(--panel2);}
  .node.locked{opacity:.45;}
  .node.cleared{box-shadow:4px 4px 0 var(--good);}
  .node .ico{font-size:18px;min-width:30px;text-align:center;}
  .node .meta{flex:1;}
  .node .meta b{font-size:11px;}
  .node .meta span{display:block;font-size:8px;color:var(--mut);margin-top:5px;}

  /* staff card */
  .staffwrap{display:flex;justify-content:center;margin:14px 0;}
  svg.staff{width:100%;max-width:340px;height:auto;}
  .staffbg{fill:var(--parch);stroke:#000;stroke-width:3;}
  .sl{stroke:var(--parch-line);stroke-width:2;}
  .ledger{stroke:var(--parch-line);stroke-width:2;}
  .stem{stroke:var(--parch-line);stroke-width:2.4;}
  .head{fill:var(--parch-line);}
  .clef{font-family:'Noto Music', serif;font-size:64px;fill:var(--parch-line);}
  .hit{fill:transparent;cursor:pointer;}
  .hit:hover{fill:rgba(70,224,255,.35);}

  .q{font-size:13px;color:var(--gold);text-align:center;margin:10px 0;}
  .feedback{min-height:20px;text-align:center;font-size:11px;margin:8px 0;}
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}

  .loot{display:inline-block;background:#000;border:2px solid var(--gold);color:var(--gold);
    font-size:8px;padding:5px 7px;margin:4px 4px 0 0;}
  .crumbs{font-size:8px;color:var(--mut);margin-bottom:6px;}
  .crumbs a{color:var(--cyan);cursor:pointer;text-decoration:none;}
  .footer{text-align:center;font-size:8px;color:var(--mut);margin-top:30px;line-height:2;}
  .footer a{color:var(--cyan);}
</style>
</head>
<body>
  <div id="app"></div>

  <script src="/quest/music.js"></script>
  <script src="/quest/audio.js"></script>
  <script src="/quest/curriculum.js"></script>
  <script src="/quest/game.js"></script>
</body>
</html>
