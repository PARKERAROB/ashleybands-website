name: Live bug or regression
description: Report something that is broken or behaving incorrectly.
title: "[Bug]: "
labels:
  - "type: bug"
  - "status: inbox"
body:
  - type: markdown
    attributes:
      value: |
        Keep this public issue sanitized. For active private-data exposure, state only the safe symptom and handle identities in the private conversation.
  - type: textarea
    id: symptom
    attributes:
      label: What happened?
      description: State the observable symptom, page, and approximate time without private facts.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Reproduction context
      description: URL, device, browser, and safe steps that help reproduce it.
  - type: dropdown
    id: urgency
    attributes:
      label: Impact
      options:
        - Active privacy, payment, authorization, or destructive harm
        - Blocks a time-sensitive program operation
        - Important but a workaround exists
        - Minor or cosmetic
        - Unknown - agent must assess
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries
      description: What must not be changed, sent, exposed, or deleted while fixing this?
      placeholder: Do not send... Preserve...
    validations:
      required: true
  - type: dropdown
    id: release
    attributes:
      label: Requested response
      options:
        - Fix, verify, and deploy
        - Investigate only; make no changes
        - Contain active harm, then diagnose and repair
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-record check
      options:
        - label: This issue contains no private student, family, credential, payment, attendance, measurement, or other protected information.
          required: true
