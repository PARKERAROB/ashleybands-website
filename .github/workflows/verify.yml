name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint .
      - name: Route registry and public privacy guardrail
        run: |
          npm run test:routes
          npm run test:privacy
      - name: Test prototypes and domain rules
        run: |
          npm run test:onboarding
          npm run test:onboarding-live
          npm run test:current-students-prototype
          npm run test:current-students-live
          npm run test:operations-prototype
          npm run test:assets-inventory-prototype
          npm run test:attendance-workspace-prototype
          npm run test:ensembles-memberships-prototype
          npm run test:memberships-live
          npm run test:sponsorship
          npm run test:design
          npm run test:newsletter
          npm run test:security
          npm run test:local-preview
      - name: Build
        # Dummy values only. The build must not need secrets; nothing here reaches a real service.
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
          SUPABASE_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: x
          SUPABASE_ANON_KEY: x
          SUPABASE_SECRET_KEY: x
          PORTAL_SESSION_SECRET: localreviewsecretlocalreviewsecret
